<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模拟 UEditor 编辑区（内层 iframe）</title>
<style>
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; }
  #ed { padding: 16px; min-height: 300px; outline: none; background: #fff; }
  #ed p { margin: 8px 0; }

</style>

<body>

<!-- 模拟 UEditor 的可编辑区：真实 UEditor 中 ed.body 也指向这类元素。
     0.2.0 起内容为"Word 粘贴风格"的脏格式，用于验证先清除全部格式再排版 -->
<div id="ed" contenteditable="true">

<div class="MsoNormal" style="margin:0cm 0cm 8pt;font-family:Calibri,sans-serif;">

<p>图 2 双图并列示例</p>
<div style="background:#ffff00;">综上，本研究提出了<u>一条可行的实施路径</u>。</div>
</div>
</div>

<input type="hidden" id="hidden">

<script>
  // ---- 模拟 UEditor 实例，暴露到本 iframe 的 window.UE ----
  var body = document.getElementById('ed');
  var mockEditor = {
    // UEditor 的 ed.body 指向可编辑区
    body: body,
    getContent: function () { return body.innerHTML; },
    setContent: function (html) { body.innerHTML = html; },
    // 真实 UEditor 提交表单前会把内容同步回 textarea
    sync: function () { document.getElementById('hidden').value = body.innerHTML; },
    fireEvent: function (name) {
      // 触发 contentchange，便于父页面观察
      try {
        parent.postMessage({ type: 'mock-contentchange', name: name }, '*');
      } catch (e) {}
    }
  };
  window.UE = { instants: { ueditorInstant0: mockEditor } };
  window.__mockEd = mockEditor;
</script>
</body>
</html>
