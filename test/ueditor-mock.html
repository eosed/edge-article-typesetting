<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模拟 UEditor 页面 · 排版扩展测试台</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: #f1f3f4; color: #202124; }
  header { background: #1a73e8; color: #fff; padding: 14px 20px; }
  header h1 { font-size: 16px; margin: 0 0 4px; }
  header p { font-size: 12px; margin: 0; opacity: .9; }
  .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  .editor-col { flex: 1 1 620px; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.12); overflow: hidden; }
  .editor-col .bar { padding: 10px 14px; border-bottom: 1px solid #e8eaed; font-size: 13px; color: #5f6368; }
  iframe { display: block; width: 100%; height: 720px; border: 0; }
  .side-col { flex: 0 0 380px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.12); padding: 14px; }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: #202124; }
  button { padding: 8px 12px; border-radius: 8px; border: 1px solid #dadce0; background: #fff; cursor: pointer; font-size: 13px; margin: 0 6px 6px 0; }
  button:hover { background: #f1f3f4; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  pre { background: #202124; color: #e8eaed; border-radius: 8px; padding: 10px; font-size: 11px; line-height: 1.5;
        max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 0; }
  .log { font-size: 12px; color: #3c4043; line-height: 1.7; max-height: 160px; overflow: auto; }
  .log .ok { color: #137333; }
  .log .warn { color: #b06000; }
  .hint { font-size: 12px; color: #5f6368; line-height: 1.7; }
</style>
</head>
<body>

<header>
  <h1>模拟 UEditor 页面 · 排版扩展测试台</h1>
  <p>编辑器实例挂在内层 iframe 的 window.UE.instants 上，用于验证扩展的跨帧下钻能力。</p>
</header>

<div class="wrap">
  <div class="editor-col">
    <div class="bar">编辑器（内层 iframe，模拟 UEditor 结构）</div>
    <iframe id="frame" src="editor-frame.html"></iframe>
  </div>

  <div class="side-col">
    <div class="card">
      <h2>检查工具</h2>
      <button class="primary" id="dump">导出当前编辑区内容</button>
      <button id="audit">审计段落样式</button>
      <button id="dumpHidden">查看已同步的隐藏域</button>
    </div>

    <div class="card">
      <h2>运行日志</h2>
      <div class="log" id="log"></div>
    </div>

    <div class="card">
      <h2>输出</h2>
      <pre id="out">点上方按钮查看结果。</pre>
    </div>

    <div class="card">
      <h2>验收要点</h2>
      <div class="hint">
        1. 右下角出现蓝色「排版」悬浮按钮<br>
        2. 点「一键排版」后：正文 22px / 1.5 行距 / 首行缩进 2 字符<br>
        3. 中文字符被包进 font-family:宋体 的 span<br>
        4. 图片段与「图 N」标题居中、不缩进<br>
        5. 点「撤销」可回到排版前
      </div>
    </div>
  </div>
</div>

<script>
  var logEl = document.getElementById('log');
  function log(text, cls) {
    var t = new Date().toLocaleTimeString();
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = '[' + t + '] ' + text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function getEd() {
    try { return document.getElementById('frame').contentWindow.__mockEd; }
    catch (e) { return null; }
  }

  document.getElementById('dump').addEventListener('click', function () {
    var ed = getEd();
    document.getElementById('out').textContent = ed ? ed.getContent() : '未取到编辑器';
    log('已导出编辑区内容，长度 ' + (ed ? ed.getContent().length : 0));
  });

  document.getElementById('dumpHidden').addEventListener('click', function () {
    var f = document.getElementById('frame').contentWindow;
    var v = f.document.getElementById('hidden').value;
    document.getElementById('out').textContent = v || '（隐藏域为空，说明尚未触发 sync）';
    log('隐藏域长度 ' + v.length);
  });

  document.getElementById('audit').addEventListener('click', function () {
    var ed = getEd();
    if (!ed) { log('未取到编辑器', 'warn'); return; }
    var rows = [];
    var ps = ed.body.querySelectorAll('p');
    ps.forEach(function (p, i) {
      var cs = getComputedStyle(p);
      var t = (p.textContent || '').replace(/\s+/g, ' ').trim();
      rows.push(
        '#' + (i + 1) +
        ' align=' + cs.textAlign +
        ' size=' + cs.fontSize +
        ' lh=' + cs.lineHeight +
        ' indent=' + cs.textIndent +
        ' imgs=' + p.querySelectorAll('img').length +
        ' | ' + (t ? t.slice(0, 22) : '（空段）')
      );
    });
    document.getElementById('out').textContent = rows.join('\n');
    log('已审计 ' + ps.length + ' 个段落');
  });

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'mock-contentchange') {
      log('编辑器触发 ' + e.data.name + '（回写已生效）', 'ok');
    }
  });

  log('测试台就绪。若扩展已加载，稍等片刻右下角应出现「排版」按钮。');
</script>
</body>
</html>
